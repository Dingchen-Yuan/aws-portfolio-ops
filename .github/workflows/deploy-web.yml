name: Deploy web

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web application
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload versioned assets
        run: >-
          aws s3 sync web/dist "s3://${{ vars.WEB_BUCKET_NAME }}"
          --delete
          --exclude index.html
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload application shell
        run: >-
          aws s3 cp web/dist/index.html
          "s3://${{ vars.WEB_BUCKET_NAME }}/index.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html"

      - name: Refresh CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.WEB_DISTRIBUTION_ID }}"
          --paths "/*"
